<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPD Case Room</title>
<link rel="stylesheet" href="theme.css">
<style>
*{-webkit-tap-highlight-color:transparent}
.topbar{height:54px;padding:0 14px;position:sticky;top:0;z-index:3}.topbar img{height:32px}.brand{font-size:14px}
.me{font-size:12px;background:var(--navy3);border-radius:6px;padding:4px 10px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#m{padding:18px 16px 90px;max-width:560px;margin:0 auto}
h1{font-size:25px;margin:6px 0 10px;line-height:1.22}p{font-size:17px;line-height:1.45}
.hero{display:flex;justify-content:center;margin:18px 0 8px;color:var(--gold)}
.c{text-align:center}

.opts{display:grid;gap:10px;margin-top:12px}
.o{border:2px solid var(--line);border-radius:12px;background:var(--navy2);color:#fff;font-family:inherit;font-size:17px;font-weight:500;padding:14px;display:flex;align-items:center;gap:14px;text-align:left;min-height:72px}
.o .tl{flex:1}.o small{display:block;color:var(--mute);font-size:13px}
.o:active{border-color:var(--gold);transform:scale(.98)}
.o.yn{min-height:110px;font-size:24px;font-weight:700}
.res{border-radius:10px;padding:20px;text-align:center;margin-top:8px;background:var(--paper);color:var(--navy);border-left:8px solid var(--line)}.res.ok{border-left-color:var(--ok)}.res.no{border-left-color:var(--red)}.res.wait{background:var(--navy2);color:#fff;border:2px solid var(--line)}
.res .rstamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-weight:700;letter-spacing:.18em;font-size:12px;padding:2px 10px;transform:rotate(-3deg);margin:4px 0 6px}.res.ok .rstamp{border-color:var(--ok);color:var(--ok)}.res.ok .hero,.res.no .hero{color:inherit!important}.res.ok .hero{color:var(--ok)!important}.res.no .hero{color:var(--red)!important}
.res h1{margin:8px 0 4px}.res .pts{font-size:22px;font-weight:700}
.card{background:var(--navy2);border-radius:12px;padding:14px 16px;margin-top:10px}
.tm{margin-left:auto;background:var(--red);color:#fff;border-radius:6px;padding:2px 10px;font-weight:700;letter-spacing:0}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#081327;border-top:1px solid var(--line)}#tabs button{flex:1;border:0;background:none;color:var(--mute);font-weight:700;font-size:14px;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px}#tabs button.on{color:#fff;box-shadow:inset 0 3px 0 var(--gold)}
.sus{margin-top:10px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.av2{background:var(--navy2);border:3px solid var(--line);border-radius:14px;padding:6px 0;color:var(--mute);display:flex;justify-content:center}.av2.on{border-color:var(--gold);color:var(--gold);background:var(--navy3)}
.notes .o{background:transparent;border:0;border-bottom:1px dashed #9aa9c4;border-radius:0;color:#1b2233;min-height:64px;padding:10px 4px}.notes .o small{color:#5a6478}.notes .o:active{background:rgba(217,165,33,.18)}
.notes h1{color:#1b2233;font-size:19px}.notes .tm{float:right}
.wv{width:100%;font-family:inherit;font-size:20px;border:2px solid #b8ab8e;border-radius:8px;padding:12px;margin:8px 0 4px;background:#fffdf6;color:#111d36}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pb{border:2px solid #b8ab8e;border-radius:10px;background:#fffdf6;padding:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:700;font-size:14px;color:#1b2233;overflow:hidden;position:relative}.pb img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 20%}.pb .tent{position:absolute;left:6px;top:6px}.pb:active{border-color:var(--gold)}
.notes .ev{border-width:3px;margin:6px 0 4px}.notes .ev img{width:100%}.o.picked{background:rgba(217,165,33,.2)!important}.onum{width:40px;height:40px;border-radius:50%;background:#1b2233;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sgrid .sus.v2{margin:0}.sgrid .sus.v2 h3{font-size:16px}.sgrid .sus.v2 p{font-size:12.5px}.sgrid .sus.v2 .pimg{aspect-ratio:1/1;object-position:50% 18%}
.avi{border-radius:50%;display:inline-block;vertical-align:middle;object-fit:cover}.av2.on{transform:scale(1.06);box-shadow:0 0 0 3px rgba(217,165,33,.45)}
.notes .ev .kbw{animation:none}
#cv{width:100%;aspect-ratio:4/3;background:#fff;border:2px solid #b8ab8e;border-radius:8px;touch-action:none;display:block}
.tool{margin:0!important;padding:8px 14px!important;font-size:15px!important;width:auto!important;display:inline-flex;gap:4px;align-items:center}.tool:disabled{opacity:.4}
.bul{margin:0 0 8px;padding-left:22px;color:#1b2233;font-size:18px;line-height:1.35}.bul li{margin:2px 0}.tb.on{background:#1b2233!important;color:#fff!important}
.pens{display:flex;gap:8px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}.pen{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #b8ab8e}.pen.on{box-shadow:0 0 0 3px #1b2233;transform:scale(1.12)}.pen.er{background:#fff;color:#1b2233;display:flex;align-items:center;justify-content:center}
</style></head><body class="board">
<div class="topbar"><img src="media/badge_white.png" alt="LPD"><div class="brand">LPD CASE ROOM<small id="ct">Lorain Police Department</small></div><div class="sp"></div><span class="me" id="me" style="display:none"></span></div>
<div id="m"></div>
<div id="tabs" style="display:none"><button id="tPlay" class="on"></button><button id="tSus"></button></div>
<script src="core.js"></script><script src="cases_public.js"></script>
<script>
const M=document.getElementById('m');
document.getElementById('tPlay').innerHTML=icon('search',16)+' Case'; document.getElementById('tSus').innerHTML=icon('users',16)+' Suspects';
let saved={}; let code=(_q.get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const store={get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const ADJ=['Sharp','Silent','Swift','Clever','Bold','Keen','Steady','Lucky','Brave','Quiet','Rapid','Cool','Calm','Bright','Iron','Night'];
const NOUN=['Falcon','Fox','Owl','Hawk','Wolf','Lynx','Panther','Raven','Eagle','Tiger','Cobra','Bear','Badger','Viper','Jaguar','Otter'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const genName=mode=>mode==='team'?rnd(SQUADS):rnd(NAME_TITLES)+' '+rnd(NAME_FUNNY);
let OFF=0, myAv=null, me=null, myName=null, ST=null, lastSeq=0, picks={}, tab='play', joinSent=false, recvAt=0, prevScore={};
let gid=null, sent={}, ordSel={};
const ASKBOX='<div class="notes" style="margin-top:14px"><div class="nh">ASK THE DETECTIVE</div><input id="av" class="wv" maxlength="160" placeholder="Your question about police work"><button class="big" id="asend">Send question</button><p class="mute" id="asent" style="color:#5a6478;margin:6px 0 0"></p></div>';
function ordTap(ri,L){ const s=ordSel[ri]=ordSel[ri]||[]; const k=s.indexOf(L); if(k>=0) s.splice(k,1); else if(s.length<4) s.push(L); render(); } function ivTap(ri,L){ const s=ordSel[ri]=ordSel[ri]||[]; const k=s.indexOf(L); if(k>=0) s.splice(k,1); else { if(s.length>=2) s.shift(); s.push(L); } render(); }
const PENS=[['#111111','black'],['#8c8c8c','gray'],['#d81b2a','red'],['#f47a1f','orange'],['#f2b705','yellow'],['#1f9a4b','green'],['#1f6fe5','blue'],['#7b3fc4','purple'],['#ff6fae','pink'],['#8a5a2b','brown'],['#fdfdfd','white']]; let pen='#111111', cvStrokes=[];
const BUCKET='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11 11 3 3 11l8 8z"/><path d="M3 11h16"/><path d="M20 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/></svg>';
let tool='pen';
function floodFill(g,W,H,x0,y0,hex){ x0=Math.round(x0); y0=Math.round(y0); if(x0<0||y0<0||x0>=W||y0>=H) return; const im=g.getImageData(0,0,W,H), d=im.data;
  const c=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; const i0=(y0*W+x0)*4, sr=d[i0], sg=d[i0+1], sb=d[i0+2];
  if(Math.abs(sr-c[0])+Math.abs(sg-c[1])+Math.abs(sb-c[2])<12) return; const T=150, seen=new Uint8Array(W*H);
  const ok=k=>{ if(seen[k]) return false; const j=k*4; return Math.abs(d[j]-sr)+Math.abs(d[j+1]-sg)+Math.abs(d[j+2]-sb)<=T; };
  const st=[y0*W+x0]; const edge=[];
  while(st.length){ const k=st.pop(); if(!ok(k)) continue; let y=(k/W)|0, xl=k-y*W, xr=xl; while(xl>0&&ok(y*W+xl-1)) xl--; while(xr<W-1&&ok(y*W+xr+1)) xr++;
    for(let x=xl;x<=xr;x++){ const q=y*W+x; seen[q]=1; const j=q*4; d[j]=c[0]; d[j+1]=c[1]; d[j+2]=c[2]; d[j+3]=255; if(y>0) st.push(q-W); if(y<H-1) st.push(q+W); }
    edge.push(y*W+xl, y*W+xr); }
  /* grow 1px into the anti-aliased outline so no white halo is left */
  for(let k=0;k<W*H;k++){ if(seen[k]) continue; const x=k%W; if((x>0&&seen[k-1]===1)||(x<W-1&&seen[k+1]===1)||(k>=W&&seen[k-W]===1)||(k<W*H-W&&seen[k+W]===1)){ const j=k*4; const lum=d[j]+d[j+1]+d[j+2]; if(lum>200){ d[j]=c[0]; d[j+1]=c[1]; d[j+2]=c[2]; seen[k]=2; } } }
  g.putImageData(im,0,0); }
function wireCanvas(){ const cv=document.getElementById('cv'); if(!cv) return; const g=cv.getContext('2d'); let cur=null;
  const base=document.createElement('canvas'); base.width=cv.width; base.height=cv.height; const bg=base.getContext('2d');
  const W=c=>c==='#ffffff'?44:12;
  const paint=(g,st)=>{ if(st.fill){ floodFill(g,cv.width,cv.height,st.x,st.y,st.c); return; } const p=st.p; g.strokeStyle=g.fillStyle=st.c; g.lineWidth=W(st.c); g.lineCap='round'; g.lineJoin='round';
    if(p.length<3){ g.beginPath(); g.arc(p[0][0],p[0][1],W(st.c)/2,0,7); g.fill(); if(p.length<2) return; }
    g.beginPath(); g.moveTo(p[0][0],p[0][1]); for(let k=1;k<p.length-1;k++){ const mx=(p[k][0]+p[k+1][0])/2, my=(p[k][1]+p[k+1][1])/2; g.quadraticCurveTo(p[k][0],p[k][1],mx,my); } const L=p[p.length-1]; g.lineTo(L[0],L[1]); g.stroke(); };
  const rebuild=()=>{ bg.fillStyle='#fff'; bg.fillRect(0,0,base.width,base.height); cvStrokes.forEach(st=>{ if(st!==cur) paint(bg,st); }); };
  const redraw=()=>{ g.drawImage(base,0,0); if(cur) paint(g,cur); const u=document.getElementById('cvu'); if(u) u.disabled=!cvStrokes.length; };
  rebuild(); redraw();
  const pt=e=>{ const b=cv.getBoundingClientRect(); return [(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]; };
  cv.onpointerdown=e=>{ e.preventDefault(); if(cur) return; const q=pt(e);
    if(tool==='fill'){ cvStrokes.push({fill:1,x:q[0],y:q[1],c:pen==='#ffffff'?'#ffffff':pen}); rebuild(); redraw(); return; }
    cv.setPointerCapture(e.pointerId); cur={c:pen,p:[q],id:e.pointerId}; cvStrokes.push(cur); redraw(); };
  cv.onpointermove=e=>{ if(!cur||e.pointerId!==cur.id) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(x=>cur.p.push(pt(x))); redraw(); };
  cv.onpointerup=cv.onpointercancel=e=>{ if(cur&&e.pointerId===cur.id){ cur=null; rebuild(); redraw(); } };
  cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  const setTool=t=>{ tool=t; document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); };
  document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>setTool(b.dataset.t)); setTool(tool);
  document.querySelectorAll('.pen').forEach(b=>b.onclick=()=>{ pen=b.dataset.c; document.querySelectorAll('.pen').forEach(x=>x.classList.toggle('on',x===b)); });
  document.getElementById('cvu').onclick=()=>{ cvStrokes.pop(); rebuild(); redraw(); };
  document.getElementById('cvc').onclick=()=>{ if(cvStrokes.length&&!confirm('Erase the whole sketch?')) return; cvStrokes=[]; rebuild(); redraw(); };
  document.getElementById('cvs').onclick=()=>{ if(!cvStrokes.length){ alert('Draw something first.'); return; } const out=document.createElement('canvas'); out.width=400; out.height=300; out.getContext('2d').drawImage(cv,0,0,400,300); answer(ST.ri,out.toDataURL('image/jpeg',.75)); cvStrokes=[]; }; }
const keep=()=>store.set('cr_'+code,{id:me,name:myName,av:myAv,picks,prevScore,g:gid});
if(!code){ M.innerHTML=`<div class="hero">${icon('shield',56)}</div><div class="kick" style="justify-content:center">Join a case</div><h1 class="c">Enter the room code</h1><p class="mute c">It's on the screen at the front of the room.</p>
  <input class="code" id="cin" maxlength="5" autocomplete="off" autocapitalize="characters"><button class="big" id="cgo">Join ${icon('next',18)}</button>`;
  document.getElementById('cgo').onclick=()=>{ const v=document.getElementById('cin').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.length===5){ const u=new URLSearchParams(location.search); u.set('r',v); location.search=u.toString(); } };
} else start();
function start(){
  saved=store.get('cr_'+code)||{}; gid=saved.g||null; me=saved.id||Math.random().toString(36).slice(2,10); myName=saved.name||null; myAv=saved.av||null; picks=saved.picks||{}; prevScore=saved.prevScore||{}; keep();
  M.innerHTML=`<div class="hero">${icon('search',56)}</div><h1 class="c">Connecting…</h1><p class="mute c">Room ${code}</p>`;
  setTimeout(()=>{ if(!ST) M.innerHTML=`<div class="hero">${icon('alert',56)}</div><h1 class="c">No case found</h1><p class="mute c">Check the code on the screen. The detective has to open the case first.</p><button class="big" onclick="location.search=''">Type the code again</button>`; },12000);
  sub(topicFor(code,'h'),(m,replay)=>{ if(!m||m.k!=='st'||m.n<=lastSeq) return; lastSeq=m.n; ['players','removed','av','acc','scores','pts','right','tally','cleared'].forEach(k=>{ if(!m[k]||typeof m[k]!=='object') m[k]={}; }); const prev=ST; ST=m; /* Firebase drops empty objects */ recvAt=Date.now(); if(!replay&&m.t) OFF=m.t-Date.now();
    if(ST.g && saved.g!==ST.g){ saved.g=ST.g; picks={}; prevScore={}; gid=ST.g; keep(); }
    if(myName && !ST.players[me] && !joinSent) sendJoin();
    if(prev && prev.g===ST.g && prev.caseId===ST.caseId && prev.step===ST.step && prev.ri===ST.ri && (ST.step==='q'||ST.step==='final'||ST.step==='reveal'||ST.step==='closure'||ST.step==='wrap') && prev.players[me] && (ST.step!=='q'||picks[ST.ri]===undefined)) return; /* same question still open: don't redraw under a finger */
    render(); }, null, true);
  setInterval(()=>{ const t=document.getElementById('tmv'); if(t&&ST&&ST.left!=null) t.textContent=(ST.deadline?Math.max(0,Math.ceil((ST.deadline-(Date.now()+OFF))/1000)):Math.max(0,ST.left-Math.floor((Date.now()-recvAt)/1000)))+'s'; },1000);
}
setInterval(()=>{ if(ST&&myName&&!ST.players[me]&&!(ST.removed||{})[me]) { joinSent=false; sendJoin(); } },4000);
window.addEventListener('online',()=>{ if(ST&&myName&&!ST.players[me]) sendJoin(); });
let joinBusy=false;
function sendJoin(){ if(joinBusy) return; joinBusy=true; joinSent=true; pub(topicFor(code,'p'),{k:'join',id:me,name:myName,av:myAv||'badge'},0).then(()=>{ joinBusy=false; },()=>{ joinBusy=false; joinSent=false; }); setTimeout(()=>{ if(ST&&!ST.players[me]) joinSent=false; },3500); }
function pickName(){ myName=document.getElementById('nm').textContent; myAv=window._av||(window._av=rnd(AVATARS)); keep(); sendJoin(); render(); }
function reroll(){ document.getElementById('nm').textContent=genName(ST?ST.mode:'solo'); }
function answer(ri,v){ if(picks[ri]!==undefined) return; if(ST&&ST.deadline&&Date.now()+OFF>=ST.deadline){ alert('Time is up for this one.'); return; } picks[ri]=v; keep(); render();
  pub(topicFor(code,'p'),{k:'ans',id:me,ri,v,g:ST.g}).then(()=>{ sent[ri]=1; if(ST&&ST.ri===ri&&ST.step==='q') render(); }).catch(()=>{ delete picks[ri]; keep(); render(); alert('Could not send. Check your signal and tap again.'); }); }
document.getElementById('tPlay').onclick=()=>{ tab='play'; render(); }; document.getElementById('tSus').onclick=()=>{ tab='sus'; render(); };
function rank(sc){ const arr=Object.entries(sc).filter(([id])=>!ST.removed[id]&&ST.players[id]).sort((a,b)=>b[1]-a[1]); const i=arr.findIndex(([id])=>id===me); return i<0?'—':(i+1)+' of '+arr.length; }
function render(){ const c=caseById(ST.caseId);
  document.getElementById('ct').textContent= ST.step==='lobby'?'Lorain Police Department':c.title;
  if(ST.removed&&ST.removed[me]){ M.innerHTML=`<div class="hero">${icon('phone',56)}</div><h1 class="c">This phone was removed</h1><p class="mute c">${ST.mode==='team'?'Your team is already playing on another phone. Join in on that one.':'Ask your detective.'}</p>`; return; }
  if(!myName){ document.getElementById('tabs').style.display='none';
    M.innerHTML=`<div class="kick">${icon(ST.mode==='team'?'users':'user',14)} Room ${code} · ${ST.mode==='team'?'Team game: one phone per team':'Solo game'}</div><h1>${ST.mode==='team'?"Your team's":'Your'} detective name</h1>
     <div class="name" id="nm">${genName(ST.mode)}</div><button class="big alt" onclick="reroll()">${icon('search',18)} New name</button>
     <div class="kick" style="margin-top:18px">Pick your detective</div><div class="avs">${(window._av=window._av||rnd(AVATARS),AVATARS).map(a=>`<button class="av2${a===window._av?' on':''}" onclick="window._av='${a}';document.querySelectorAll('.av2').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${avHTML(a,64)}</button>`).join('')}</div>
     <button class="big" onclick="pickName()">Join the case ${icon('next',18)}</button>`; return; }
  const ok=ST.players[me], meEl=document.getElementById('me'); meEl.style.display=''; meEl.innerHTML=avHTML(myAv||'badge',20)+' '+esc(ok||myName);
  if(!ok){ M.innerHTML=`<div class="hero">${icon('search',56)}</div><h1 class="c">Joining…</h1><p class="mute c">If this takes more than a few seconds, check your signal.</p>`; return; }
  const showTabs=!['lobby','intro'].includes(ST.step); document.getElementById('tabs').style.display=showTabs?'flex':'none';
  document.getElementById('tPlay').className=tab==='play'?'on':''; document.getElementById('tSus').className=tab==='sus'?'on':'';
  if(tab==='sus'&&showTabs){ M.innerHTML=`<div class="kick">${icon('folder',14)} Case file</div><h1>The suspects</h1><div class="sgrid">`+suspectsHTML(c,ST.pos,ST.cleared||{})+'</div>'; return; }
  const r=ST.ri!=null?(ST.round||{}):null, sc=ST.scores||{}, total=sc[me]||0;
  let h='';
  switch(ST.step){
    case 'lobby': h=`<div class="hero">${avHTML(myAv||'badge',120)}</div><h1 class="c">You're in</h1><p class="mute c">Eyes on the screen. Your detective will open the case.</p>`; break;
    case 'intro': h=`<div class="hero">${icon('film',60)}</div><div class="kick" style="justify-content:center">${esc(c.crime)}</div><h1 class="c">${esc(c.title)}</h1><p class="mute c">Watch the screen. Your case is starting.</p>`; break;
    case 'suspects': h=`<div class="kick">${icon('users',14)} Meet the suspects</div><h1>Keep all four in mind</h1><div class="sgrid">`+suspectsHTML(c,ST.pos,ST.cleared||{})+'</div>'; break;
    case 'story': h=`<div class="notes"><div class="nh">FIELD REPORT · ${r.when?esc(r.when)+' · ':''}${esc(r.title).toUpperCase()}</div>${r.img?evHTML(r,{small:true}):''}<p style="color:#1b2233">${esc(r.text)}</p></div><p class="mute" style="display:flex;gap:8px;align-items:center">${icon('ear',18)} Listen to your detective.</p>`; break;
    case 'q': { const mine=picks[ST.ri], opts=optionsOf(c,r);
      if(mine!==undefined&&r.kind==='draw'){ h=`<div class="res wait"><div class="hero" style="margin:0">${icon('note',60)}</div><h1>${(ST.acc&&ST.acc[me])||sent[ST.ri]?'Sketch sent':'Sending…'}</h1><p class="mute">Your detective picks the best three to show the room.</p></div>`; }
      else if(mine!==undefined&&r.kind==='interview'){ h=`<div class="res wait"><div class="hero" style="margin:0">${icon('mic',60)}</div><h1>${(ST.acc&&ST.acc[me])||sent[ST.ri]?'Locked in':'Sending…'}</h1>${String(mine).split('').map(L=>`<p>${tent(L,30)} ${esc(r.options['ABCD'.indexOf(L)])}</p>`).join('')}<p class="mute">The two most-picked questions get asked.</p></div>`; }
      else if(mine!==undefined){ const o=r.kind==='word'?{tag:'yes',label:String(mine)}:r.kind==='order'?{tag:String(mine)[0],label:String(mine).split('').map(L=>noTime(r.items['ABCD'.indexOf(L)])).join(' → ')}:(opts.find(x=>String(x.value)===String(mine))||{tag:'A',label:''}); h=`<div class="res wait"><div class="hero" style="margin:0">${tent(o.tag,64)}</div><h1>${(ST.acc&&ST.acc[me])||sent[ST.ri]?'Locked in':'Sending…'}</h1><p>${esc(o.label)}</p><p class="mute">${(ST.acc&&ST.acc[me])||sent[ST.ri]?'Waiting for everyone else…':'Hang on…'}</p></div>`; }
      else if(r.kind==='word') h=`<div class="notes"><div class="nh">FIELD NOTES · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div><h1>${esc(r.q)}</h1><input id="wv" class="wv" maxlength="24" autocomplete="off" placeholder="one or two words"><button class="big" id="wsend">Send ${icon('next',18)}</button></div>`;
      else if(r.kind==='order'){ const sel=ordSel[ST.ri]=ordSel[ST.ri]||[]; h=`<div class="notes"><div class="nh">FIELD NOTES · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div><h1>${esc(r.q)}</h1><p style="color:#5a6478;margin:0 0 6px">Tap the events in order: first one first.</p><div class="opts">`+
        r.items.map((it,i)=>{ const L='ABCD'[i], k=sel.indexOf(L); return `<button class="o${k>=0?' picked':''}" onclick="ordTap(${ST.ri},'${L}')">${k>=0?`<span class="onum">${k+1}</span>`:tent(L,40)}<span class="tl">${esc(noTime(it))}</span></button>`; }).join('')+`</div>${sel.length===4?`<button class="big" onclick="answer(${ST.ri},'${sel.join('')}')">Lock in this order ${icon('check',18)}</button>`:''}${sel.length?`<button class="big alt" onclick="ordSel[${ST.ri}]=[];render()">Start over</button>`:''}</div>`; }
      else if(r.kind==='interview'){ const sel=ordSel[ST.ri]=ordSel[ST.ri]||[]; h=`<div class="notes"><div class="nh">INTERVIEW · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div><h1>${esc(r.q)}</h1><p style="color:#5a6478;margin:0 0 6px">Tap the 2 questions you want asked.</p><div class="opts">`+
        r.options.map((o,i)=>{ const L='ABCD'[i], on=sel.includes(L); return `<button class="o${on?' picked':''}" onclick="ivTap(${ST.ri},'${L}')">${on?`<span class="onum">${icon('check',20)}</span>`:tent(L,40)}<span class="tl">${esc(o)}</span></button>`; }).join('')+`</div>${sel.length===2?`<button class="big" onclick="answer(${ST.ri},'${sel.slice().sort().join('')}')">Ask these two ${icon('mic',18)}</button>`:''}</div>`; }
      else if(r.kind==='draw'){ h=`<div class="notes"><div class="nh">SKETCH IT · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div>${r.bullets?`<h1>${esc(r.lead||r.q)}</h1><ul class="bul">${r.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:`<h1>${esc(r.q)}</h1><p style="color:#1b2233;margin:0 0 8px"><b>Witness:</b> “${esc(r.witness||'')}”</p>`}<canvas id="cv" width="800" height="600"></canvas><div class="pens" style="margin-bottom:4px"><button class="big alt tool tb" data-t="pen">Draw</button><button class="big alt tool tb" data-t="fill">${BUCKET} Fill</button></div><div class="pens">${PENS.map(([c,n])=>`<button class="pen${c===pen?' on':''}" data-c="${c}" style="background:${c}" aria-label="${n}"></button>`).join('')}<button class="pen er${pen==='#ffffff'?' on':''}" data-c="#ffffff" style="width:auto;border-radius:19px;padding:0 12px;font:700 14px Poppins,Arial">Eraser</button><button class="big alt tool" id="cvu">${icon('back',16)} Undo</button><button class="big alt tool" id="cvc">Clear</button></div><button class="big" id="cvs">Send my sketch ${icon('next',18)}</button></div>`; }
      else if(r.kind==='pics'||r.kind==='suspect') h=`<div class="notes"><div class="nh">FIELD NOTES · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div><h1>${esc(r.q)}</h1><div class="pgrid">`+
        opts.map(o=>`<button class="pb" onclick='answer(${ST.ri},${JSON.stringify(o.value)})'><img src="${esc(o.img)}" alt="">${tent(o.tag,34)}<span>${esc(o.label)}</span></button>`).join('')+`</div></div>`;
      else h=`<div class="notes"><div class="nh">FIELD NOTES · ${esc(r.title).toUpperCase()}<span class="tm" id="tmv">${ST.left}s</span></div><h1>${esc(r.q)}</h1>${r.img&&r.kind!=='blur'?evHTML(r,{small:true}):''}${r.kind==='blur'?'<p style="color:#5a6478;margin:0">Watch the screen: the photo gets clearer. Answer early for more points.</p>':''}<div class="opts">`+
        opts.map(o=>`<button class="o${r.kind==='yn'?' yn':''}" onclick='answer(${ST.ri},${JSON.stringify(o.value)})'>${tent(o.tag,44)}<span class="tl">${esc(o.label)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span></button>`).join('')+`</div></div>`;
      break; }
    case 'bars': { const o=r.kind==='word'?(picks[ST.ri]!==undefined?{label:String(picks[ST.ri])}:null):r.kind==='order'?(picks[ST.ri]!==undefined?{label:String(picks[ST.ri]).split('').map(L=>(r.items||[])['ABCD'.indexOf(L)]).join(' → ')}:null):optionsOf(c,r).find(x=>String(x.value)===String(picks[ST.ri]));
      h=`<div class="res wait"><div class="hero" style="margin:0">${icon('help',60)}</div><h1>${r.scored===false?'Hunch logged':'Answers are in'}</h1><p>${o?'You picked: <b>'+esc(o.label)+'</b>':"You didn't answer this one."}</p><p class="mute">Look at the screen. Why did people pick different answers? Be ready to explain yours.</p></div>`; break; }
    case 'gallery': h=`<div class="hero">${icon('note',60)}</div><h1 class="c">Sketches are in</h1><p class="mute c">Your detective is picking three to show. Watch the screen.</p>`; break;
    case 'board': h=`<div class="hero">${icon('folder',60)}</div><div class="kick" style="justify-content:center">Case board</div><h1 class="c">Follow the strings</h1><p class="mute c">Red string means a clue points at that suspect. Who fits every clue? Talk it over.</p>`; break;
    case 'wrap': h=`<div class="hero">${icon('film',60)}</div><h1 class="c">Case closed</h1><p class="mute c">Watch the screen: the arrest and what happens next.</p>${ASKBOX}`; break;
    case 'ans': if(r.kind==='interview'){ h=`<div class="hero">${icon('mic',60)}</div><h1 class="c">The suspect answers</h1>${(ST.iv||[]).map((k,j)=>`<div class="notes" style="margin-top:10px"><div class="nh">Q: ${esc(r.options[k])}</div><p style="margin:4px 0 0;color:#1b2233">“${esc((ST.ivA||[])[j]||'')}”</p></div>`).join('')}<div class="notes" style="margin-top:12px"><div class="nh">CASE NOTES · WHY</div><p style="margin:6px 0 0;color:#1b2233">${esc(ST.why||'')}</p></div>`; break; }
      { const got=ST.acc&&ST.acc[me], mine=got?picks[ST.ri]:undefined, right=!!(got&&ST.right&&ST.right[me]);
      if(prevScore.ri!==ST.ri){ prevScore={ri:ST.ri,gain:total-(prevScore.total||0),total}; keep(); }
      h=`<div class="res ${right?'ok':'no'}"><div class="hero" style="margin:0;color:#fff">${icon(right?'check':mine===undefined?'clock':'x',64)}</div><div class="rstamp">${right?'EVIDENCE CONFIRMED':mine===undefined?'NO ENTRY':'LEAD RULED OUT'}</div><h1>${right?'Solid lead':mine===undefined?(picks[ST.ri]!==undefined?'Not received in time':'No answer'):'Check the evidence'}</h1><div class="pts">${right?'+'+((ST.pts||{})[me]||0).toLocaleString()+' points':'+0'}</div><p style="color:#3a4a66">Case score ${total.toLocaleString()} · Standing ${rank(sc)}</p></div>${r.kind==='decision'&&ST.outM?`<div class="notes" style="margin-top:12px"><div class="nh">WHAT HAPPENED</div><p style="margin:6px 0 0;color:#1b2233">${esc(ST.outM)}</p>${ST.maj!==ST.correct?`<div class="nh" style="margin-top:8px">THE BEST MOVE</div><p style="margin:6px 0 0;color:#1b2233">${esc(ST.outB||'')}</p>`:''}</div>`:''}<div class="notes" style="margin-top:12px"><div class="nh">CASE NOTES · WHY</div><p style="margin:6px 0 0;color:#1b2233">${esc(ST.why||'')}</p></div>`; break; }
    case 'xboard': h=`<div class="hero">${icon('folder',60)}</div><div class="kick" style="justify-content:center">Case board</div><h1 class="c">Look at the board</h1><p class="mute c">Which clue could fit which suspect? Who can you NOT rule out yet? Talk it over.</p>`; break;
    case 'leader': h=`<div class="hero">${icon('chart',60)}</div><h1 class="c">You're #${rank(sc)}</h1><p class="c">${total.toLocaleString()} points</p><p class="mute c">Top 5 are on the screen.</p>`; break;
    case 'closure': { const RV=ST.reveal||{}; h=`<div class="hero">${icon('shield',60)}</div><div class="kick" style="justify-content:center">Case closed</div><h1 class="c">${esc(RV.headline)}</h1>${RV.safety?`<div class="card"><p style="margin:0"><b>Stay safe:</b> ${esc(RV.safety)}</p></div>`:''}<div class="card"><p style="margin:0">${esc(RV.lesson)}</p></div>${ASKBOX}`; break; }
    case 'reveal': { const RV=ST.reveal||{}; h=`<div class="hero">${icon('shield',60)}</div><div class="kick" style="justify-content:center">Case closed</div><h1 class="c">${esc(RV.headline)}</h1><div class="card"><p style="margin:0">${esc(RV.lesson)}</p></div>${ASKBOX}`; break; }
    case 'final': h=`<div class="hero">${icon('award',64)}</div><h1 class="c">Final rank: #${rank(sc)}</h1><p class="c">${total.toLocaleString()} points</p>${ASKBOX}`; break;
  }
  M.innerHTML=h;
  wireCanvas();
  const ws=document.getElementById('wsend'); if(ws) ws.onclick=()=>{ const v=cleanWord(document.getElementById('wv').value); if(v) answer(ST.ri,v); };
  const as=document.getElementById('asend'); if(as) as.onclick=()=>{ const t=document.getElementById('av').value.trim(); if(!t) return; pub(topicFor(code,'p'),{k:'ask',id:me,g:ST.g,mid:me+'-'+Date.now(),text:t.slice(0,160)}).then(()=>{ document.getElementById('av').value=''; document.getElementById('asent').textContent='Sent to the detective.'; }).catch(()=>{ document.getElementById('asent').textContent='Could not send. Try again.'; }); };
}
</script></body></html>
