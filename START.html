<script>
/* LPD Case Room v3, one file: open this on the classroom computer (USB stick or web). It runs the game, shows the class screen,
   plays the host voice and talks to the phones. Answers stay on this computer; phones only get them at the reveal. */
const M=document.getElementById('main');

  const cs=getComputedStyle(M), pv=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom); const z=Math.max(.62,(avail-pv-6)/(M.scrollHeight-pv)); kids.forEach(k=>k.style.zoom=z); }
M.addEventListener('load',()=>fitMain(),true); addEventListener('resize',()=>fitMain());
function draw(){ ST=pubState(); recv=Date.now(); render(); extras(); bar(); fitMain(); setTimeout(fitMain,120); setTimeout(fitMain,700); }
function bar(){ const s=cur();
  document.getElementById('bk').innerHTML=icon('back',16)+' Back'; document.getElementById('bk').disabled=S.step===0;
  const pz=document.getElementById('pz'); pz.innerHTML=S.pausedAt?icon('play',16)+' Play':'<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause'; pz.style.display=s.t==='lobby'?'none':''; pz.className='btn'+(S.pausedAt?' gold':'');
  const holds={board:'Paused for discussion: press Next when ready',reveal:'Talk it over, then press Next',closure:'Talk it over, then press Next',gallery:'Click a sketch to hide it',final:''};
  document.getElementById('hint').textContent=s.t==='lobby'?'Space = pause · arrows = back / next':(holds[s.t]!=null?holds[s.t]:'');
  hostUI(speaking);
  const nx=document.getElementById('nx'); nx.innerHTML=(NEXTLBL[s.t]||'Next')+' '+icon('next',16); nx.className='btn '+(s.t==='bars'?'gold':'red');
  const nq=(S.asks||[]).filter(x=>!x.bad).length;
  document.getElementById('extra').innerHTML=s.t==='q'?`<button class="btn" id="plus">${icon('plus',14)} 15 s</button>`:s.t==='gallery'?`<button class="btn" id="rev">${icon('eye',16)} Pick sketches privately</button>`:['reveal','closure','wrap'].includes(s.t)&&nq?`<span class="pill">${icon('help',14)} ${nq} student question${nq>1?'s':''} waiting</span>`:'';
  const p=document.getElementById('plus'); if(p) p.onclick=e=>{ e.currentTarget.blur(); S.limit[s.ri]=lim(s.ri)+15; save(); shownKey=''; draw(); broadcast(); };
  const rv=document.getElementById('rev'); if(rv) rv.onclick=e=>{ e.currentTarget.blur(); openReview(); }; }
document.getElementById('bk').onclick=e=>{ e.currentTarget.blur(); back(); };
document.getElementById('pz').onclick=e=>{ e.currentTarget.blur(); setPaused(!S.pausedAt); };
document.getElementById('nx').onclick=e=>{ e.currentTarget.blur(); if(cur().t==='final'){ if(confirm('Start a new game? Everyone will need to scan again.')){ sessionStorage.removeItem('cr_state'); location.href=location.pathname+location.search.replace(/[?&]new=1/,''); } return; } next(); };
/* things only this computer can do: pick the case, remove a duplicate phone, hide a word, put a student question up */
function extras(){ const s=cur(), c=C();
  if(s.t==='lobby'){ const L=M.querySelector('.lob > div'); if(L&&!document.getElementById('pick')){ L.insertAdjacentHTML('beforeend',`<div id="pick"><div class="pick">${CASES.map(k=>`<div class="file${k.id===S.caseId?' on':''}" data-c="${k.id}"><img class="thumb" src="${esc(k.intro.shots[0])}" alt=""><h3>${esc(k.title)}</h3></div>`).join('')}</div>
      <div class="mrow"><button class="mode${S.mode==='team'?' on':''}" data-m="team">${icon('users',18)} Teams</button><button class="mode${S.mode==='solo'?' on':''}" data-m="solo">${icon('user',18)} Solo</button></div></div>`);
      M.querySelectorAll('.pick .file').forEach(b=>b.onclick=()=>{ S.caseId=b.dataset.c; S.gameId=Math.random().toString(36).slice(2,10); S.ans={}; S.opened={}; S.limit={}; S.hide={}; S.asks=[]; S.qa=null; S.rev={}; S.seenAsk={}; S.drawPick={}; S.noVideo=0; STEPS=buildSteps(); save(); shownKey=''; draw(); broadcast(); });
      M.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.m; save(); shownKey=''; draw(); broadcast(); }); } }
  if(s.t==='bars'&&c.rounds[s.ri].kind==='word') M.querySelectorAll('.cloud span').forEach(sp=>{ sp.title='Click to hide this word'; sp.onclick=()=>{ S.hide=S.hide||{}; (S.hide[s.ri]=S.hide[s.ri]||{})[sp.textContent]=1; save(); shownKey=''; draw(); broadcast(); }; });
  if(s.t==='ans'&&c.rounds[s.ri].ifwrong&&c.rounds[s.ri].scored!==false){ const w=M.querySelector('.panelw:last-child'); if(w) w.insertAdjacentHTML('afterend',`<div class="panelw gold"><span class="tag" style="background:var(--navy)">${icon('help',14)} IF THEY MISSED IT, ASK</span><div>${c.rounds[s.ri].ifwrong.map(esc).join('<br>')}</div></div>`); }
  if(s.t==='ans'&&c.rounds[s.ri].kind==='word'){ const r=c.rounds[s.ri]; M.querySelectorAll('.cloud span').forEach(sp=>{ if(isRight(r,sp.textContent)){ sp.style.color='#7ee2a6'; sp.style.textDecoration='underline'; } else sp.style.color='#8794ad'; }); }
  if(s.t==='final'){ const ok=(S.asks||[]).filter(x=>!x.bad); if(!S.qa&&ok.length&&!S.qaShown){ S.qaShown=1; S.qa=ok[0].text; save(); setTimeout(()=>{ shownKey=''; draw(); broadcast(); },0); return; } const i=ok.findIndex(x=>x.text===S.qa), lb=M.querySelector('.lb');
    if(lb) lb.insertAdjacentHTML('beforeend',`<div class="asks"><button class="btn gold" id="qnext">${icon('help',16)} ${ok.length?(i<0?'Show a student question':'Next question')+' ('+(i+1>0?i+1:0)+' of '+ok.length+')':'No student questions yet'}</button>${S.qa?' <button class="btn" id="qhide">Hide</button>':''}</div>`);
    const qn=document.getElementById('qnext'); if(qn) qn.onclick=()=>{ if(!ok.length) return; S.qa=ok[(i+1)%ok.length].text; save(); shownKey=''; draw(); broadcast(); };
    const qh=document.getElementById('qhide'); if(qh) qh.onclick=()=>{ S.qa=null; save(); shownKey=''; draw(); broadcast(); }; }
}
draw(); broadcast(); if(cur().t!=='lobby') hostRun();
</script></body></html>
